<!DOCTYPE html>
<html>
<head>
    <title>AI Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="main-container">
        <div id="chat-container">
            <div id="chat-header">
                <div class="header-left">
                    <div class="header-avatar-container">
                        <img src="{{ config.bot_avatar }}" class="header-avatar">
                        <div class="status-indicator"></div>
                    </div>
                    <div class="header-info">
                        <span class="header-name">{{ config.bot_name }}</span>
                        <span class="header-status">Online</span>
                    </div>
                </div>
                <div class="header-right">
                    <button class="header-btn" title="Call">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19c-.54 0-.99.45-.99.99 0 9.36 7.6 16.96 16.96 16.96.54 0 .99-.45.99-.99v-3.5c0-.54-.45-.99-.99-.99z"/>
                        </svg>
                    </button>
                    <button class="header-btn" title="Video Call">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                        </svg>
                    </button>
                    <button class="header-btn" title="Pin Message">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16,12V4H17V2H7V4H8V12L6,14V16H11.2V22H12.8V16H18V14L16,12Z"/>
                        </svg>
                    </button>
                    <button class="header-btn" title="More Options">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="12" cy="12" r="2"/>
                            <circle cx="4" cy="12" r="2"/>
                            <circle cx="20" cy="12" r="2"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="chat-window"></div>
            <div id="typing-indicator" class="typing-indicator" style="display: none;">
                <div class="typing-content">
                    <!-- <img src="{{ config.bot_avatar }}" class="avatar"> -->
                    <span class="username">{{ config.bot_name }}</span>
                    <div class="typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <span class="typing-text">is typing...</span>
                </div>
            </div>
            <div id="input-container">
                <textarea id="message-input" placeholder="Message @{{ config.bot_name }}"></textarea>
                <button id="send-btn">Send</button>
            </div>
        </div>
        
        <div id="resize-handle"></div>
        
        <div id="profile-panel">
            <div class="profile-header">
                <div class="profile-banner" style="background-color: {{ config.profile_banner_color }}"></div>
                <div class="profile-avatar-container">
                    <img src="{{ config.bot_avatar }}" class="profile-avatar">
                    <div class="profile-status-indicator"></div>
                </div>
                <div class="profile-info">
                    <h2 class="profile-username">{{ config.bot_name }}</h2>
                    <p class="profile-tag">She/Her • Online</p>
                </div>
            </div>
            
            <div class="profile-content">
                <div class="profile-section">
                    <h3>About Me</h3>
                    <div class="about-me-text">
                        {% for line in config.profile_about_me.split('\n') %}
                            <p>{{ line }}</p>
                        {% endfor %}
                    </div>
                </div>
                
                <div class="profile-section">
                    <h3>Member Since</h3>
                    <p class="member-since">{{ config.profile_member_since }}</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById("chat-window");
        const input = document.getElementById("message-input");

        let lastSender = null;
        let lastMessageTime = 0;
        const TIME_GAP = 5 * 60 * 1000; // 5 min
        let inactivityTimer = null;
        let lastUserMessage = "";
        
        // Emoji configuration
        let emojiConfig = {};
        
        // Load emoji configuration
        async function loadEmojiConfig() {
            try {
                const response = await fetch('/static/emojis/emoji_config.json');
                emojiConfig = await response.json();
            } catch (error) {
                console.log('No emoji config found or error loading it');
            }
        }
        
        // Process text to replace emoji codes with images
        function processEmojis(text) {
            if (!emojiConfig || Object.keys(emojiConfig).length === 0) {
                return text;
            }
            
            return text.replace(/:(\w+):/g, function(match, emojiCode) {
                if (emojiConfig[emojiCode]) {
                    return `<img src="/static/emojis/${emojiConfig[emojiCode]}" class="emoji" alt=":${emojiCode}:" title=":${emojiCode}:">`;
                }
                return match; // Return original if emoji not found
            });
        }

        function appendMessage(senderType, text, avatar, username, badge, time) {
            let now = new Date();
            let showHeader = senderType !== lastSender || (now - lastMessageTime > TIME_GAP);
            lastSender = senderType;
            lastMessageTime = now;

            let msgGroup = document.createElement("div");
            msgGroup.className = "message-group";

            if (showHeader) {
                msgGroup.innerHTML += `
                    <div class="message-row">
                        <img src="${avatar}" class="avatar">
                        <div class="message-content">
                            <div class="header">
                                <span class="username">${username}</span>
                                ${badge ? `<img src="${badge}" class="badge">` : ""}
                                <span class="timestamp">${time}</span>
                            </div>
                            <div class="message-text">${processEmojis(text)}</div>
                        </div>
                    </div>
                `;
            } else {
                msgGroup.innerHTML += `
                    <div class="message-text message-continuation">${processEmojis(text)}</div>
                `;
            }

            chatWindow.appendChild(msgGroup);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function sendMessage() {
            let msg = input.value.trim();
            if (!msg) return;

            // Clear inactivity timer
            if (inactivityTimer) {
                clearTimeout(inactivityTimer);
                inactivityTimer = null;
            }

            appendMessage("user", msg, "{{ config.user_avatar }}", "{{ config.user_name }}", "", new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
            lastUserMessage = msg;
            input.value = "";

            // Show typing indicator
            
            // wait for 2 seconds
            await new Promise(resolve => setTimeout(resolve, 2000));

            const typingIndicator = document.getElementById("typing-indicator");
            typingIndicator.style.display = "block";
            chatWindow.scrollTop = chatWindow.scrollHeight;

            let res = await fetch("/send_message", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: msg})
            });
            let data = await res.json();

            // Hide typing indicator
            typingIndicator.style.display = "none";

            appendMessage("bot", data.reply, "{{ config.bot_avatar }}", "{{ config.bot_name }}", "", data.timestamp);
            
            // Start inactivity timer
            startInactivityTimer();
        }

        document.getElementById("send-btn").onclick = sendMessage;

        input.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Inactivity timer functions
        function startInactivityTimer() {
            const timeoutSeconds = parseInt("{{ config.inactivity_timeout }}");
            inactivityTimer = setTimeout(async () => {
                await sendInactivityMessage();
            }, timeoutSeconds * 1000);
        }
        
        async function sendInactivityMessage() {
            // Show typing indicator
            const typingIndicator = document.getElementById("typing-indicator");
            typingIndicator.style.display = "block";
            chatWindow.scrollTop = chatWindow.scrollHeight;
            
            let res = await fetch("/inactivity_message", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({last_message: lastUserMessage})
            });
            let data = await res.json();
            
            // Hide typing indicator
            typingIndicator.style.display = "none";
            
            appendMessage("bot", data.reply, "{{ config.bot_avatar }}", "{{ config.bot_name }}", "", data.timestamp);
            
            // Restart timer for next inactivity check
            startInactivityTimer();
        }
        
        // Track user input activity
        input.addEventListener("input", function() {
            if (inactivityTimer) {
                clearTimeout(inactivityTimer);
                inactivityTimer = null;
            }
        });
        
        input.addEventListener("keydown", function(e) {
            if (inactivityTimer) {
                clearTimeout(inactivityTimer);
                inactivityTimer = null;
            }
        });
        
        // Load emoji config when page loads
        loadEmojiConfig();
        
        // Resizable profile panel functionality
        // Resizable profile panel functionality (right sidebar)
        const resizeHandle = document.getElementById('resize-handle');
        const profilePanel = document.getElementById('profile-panel');
        let isResizing = false;
        let startX, startWidth;

        resizeHandle.addEventListener('mousedown', function(e) {
            isResizing = true;
            startX = e.clientX;
            startWidth = parseInt(getComputedStyle(profilePanel).width, 10);
            document.body.style.cursor = 'col-resize';
            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (!isResizing) return;
            const dx = startX - e.clientX;
            let newWidth = startWidth + dx;
            const minWidth = 200;
            const maxWidth = 600;
            if (newWidth < minWidth) newWidth = minWidth;
            if (newWidth > maxWidth) newWidth = maxWidth;
            profilePanel.style.width = newWidth + 'px';
            // Move the handle to the left edge of the profile panel
            resizeHandle.style.right = newWidth + 'px';
        });

        // Set initial handle position on page load and after resizing
        function updateResizeHandlePosition() {
            const width = parseInt(getComputedStyle(profilePanel).width, 10);
            resizeHandle.style.right = width + 'px';
        }
        window.addEventListener('resize', updateResizeHandlePosition);
        document.addEventListener('DOMContentLoaded', updateResizeHandlePosition);

        document.addEventListener('mouseup', function() {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
            }
        });
    </script>
</body>
</html>
